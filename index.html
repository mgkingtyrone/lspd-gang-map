<!DOCTYPE html>

  <title>LSPD Gang Territory Database</title>
  <style>
    body { font-family: Arial; margin: 20px; background: #111; color: #0f0; }
    h1 { color: #0f0; }
    input { padding: 12px; width: 300px; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #0f0; padding: 10px; text-align: left; }
    th { background: #222; }
    .result { margin-top: 20px; padding: 15px; background: #222; border: 2px solid #0f0; }
    .gang-name { font-weight: bold; }
  </style>
</head>
<body>

  <p><strong>Enter Postal Code:</strong></p>
  <input type="text" id="search" placeholder="e.g. 305" onkeyup="searchPostal()">
  
  <div id="result" class="result" style="display:none;"></div>

      {

        weapons: "Unknown",
        members: [],
        notes: "Added per intel."
      }
    ];

    function searchPostal() {
      const input = document.getElementById("search").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "none";

      if (!input) return;

      const found = territories.find(t => t.postals.includes(input));

      if (found) {
        resultDiv.innerHTML = `
          <strong>Gang:</strong> ${found.gang}<br>
          <strong>Colors:</strong> ${found.colors}<br>
          <strong>Known Weapons:</strong> ${found.weapons}<br>
          <strong>Known Members:</strong> ${found.members.length ? found.members.join(", ") : "None listed"}<br>
          <strong>Notes:</strong> ${found.notes}
        `;
        resultDiv.style.display = "block";
      } else {
        resultDiv.innerHTML = `<strong style="color:#f00;">No gang territory found for postal ${input}</strong>`;
        resultDiv.style.display = "block";
      }
    }

    // Build table with color-coded gang names
    const table = document.getElementById("table");
    territories.forEach(t => {
      const row = table.insertRow();
      let colorStyle = '';
      if (t.colors.includes("Green")) colorStyle = 'color:#00ff00;';
      else if (t.colors.includes("Red")) colorStyle = 'color:#ff0000;';
      else if (t.colors.includes("Blue")) colorStyle = 'color:#0088ff;';
      else if (t.colors.includes("Pink")) colorStyle = 'color:#ff69b4;';
      else if (t.colors.includes("White")) colorStyle = 'color:#ffffff;';
      else if (t.colors.includes("Baby Blue")) colorStyle = 'color:#89cff0;';
      else if (t.colors.includes("Dark Blue")) colorStyle = 'color:#00008b;';
      else if (t.colors.includes("Light Red")) colorStyle = 'color:#ff6666;';
      else if (t.colors.includes("Purple")) colorStyle = 'color:#a020f0;';

      row.innerHTML = `<td class="gang-name" style="${colorStyle}">${t.gang}</td><td>${t.postals.join(", ")}</td><td>${t.colors}</td><td>${t.weapons}</td><td>${t.members.join("<br>") || "None listed"}</td><td>${t.notes}</td>`;
    });
  </script>
</body>
</html>
